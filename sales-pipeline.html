<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .deal-card { transition: transform 0.15s, box-shadow 0.15s; }
        .deal-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .stage-column { min-height: 400px; }
        .modal { backdrop-filter: blur(4px); }
        .overdue { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-slate-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold">Sales Pipeline</h1>
                <button onclick="showAddModal()" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-lg font-medium flex items-center gap-2">
                    <span class="text-xl">+</span> New Deal
                </button>
            </div>
            <div id="stats" class="flex gap-4 mt-3 text-sm opacity-90"></div>
        </div>
    </header>

    <!-- Follow-up Alerts -->
    <div id="alertBanner" class="hidden">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div id="alertContent" class="bg-red-100 border border-red-300 text-red-800 px-4 py-3 rounded-lg flex items-center gap-3">
                <span class="text-xl">⚠</span>
                <div id="alertMessage"></div>
            </div>
        </div>
    </div>

    <!-- Pipeline Board -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div id="pipeline" class="flex gap-4 overflow-x-auto pb-4"></div>
    </main>

    <!-- Modal -->
    <div id="modal" class="modal fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-5 border-b">
                <h2 id="modalTitle" class="text-xl font-bold">Add Deal</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <form id="dealForm" class="p-5 space-y-4">
                <input type="hidden" id="dealId">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Company / Deal Name *</label>
                    <input type="text" id="dealName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Deal Value ($)</label>
                        <input type="number" id="dealValue" step="0.01" min="0" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Stage</label>
                        <select id="dealStage" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contact Name</label>
                    <input type="text" id="dealContact" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="dealEmail" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                        <input type="tel" id="dealPhone" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Follow-up Date</label>
                    <input type="date" id="dealFollowup" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Add Note</label>
                    <textarea id="dealNote" rows="2" placeholder="Add a note..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div id="existingNotes" class="space-y-2"></div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" id="submitBtn" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg font-medium">
                        Save Deal
                    </button>
                    <button type="button" id="deleteBtn" onclick="deleteDeal()" class="hidden bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-lg font-medium">
                        Delete
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Email Draft Modal -->
    <div id="emailModal" class="modal fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-5 border-b">
                <h2 class="text-xl font-bold">📧 Draft Follow-up Email</h2>
                <button onclick="closeEmailModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">To</label>
                    <input type="text" id="emailTo" readonly class="w-full px-3 py-2 border rounded-lg bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                    <input type="text" id="emailSubject" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                    <textarea id="emailBody" rows="10" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 font-mono text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Template</label>
                    <select id="emailTemplate" onchange="applyEmailTemplate()" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></select>
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="openInEmailClient()" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg font-medium">
                        📤 Open in Email Client
                    </button>
                    <button onclick="copyEmailToClipboard()" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-2 px-4 rounded-lg font-medium">
                        📋 Copy to Clipboard
                    </button>
                </div>
                <p class="text-xs text-gray-500 text-center">Tip: Edit the template above before sending. Variables like {contact_name} are auto-filled.</p>
            </div>
        </div>
    </div>

    <script>
    // ============================================================================
    // CONFIGURATION - Customize these to match your sales process
    // ============================================================================

    const STAGES = [
        { id: 'contact', name: 'Contact', color: 'bg-blue-500', icon: '○' },
        { id: 'proposal_sent', name: 'Proposal Sent', color: 'bg-amber-500', icon: '◕' },
        { id: 'won', name: 'Won', color: 'bg-green-500', icon: '✓' },
        { id: 'lost', name: 'Lost', color: 'bg-gray-400', icon: '✗' },
    ];

    // Email templates - customize these for your business!
    // Available variables: {contact_name}, {contact_first_name}, {company}, {deal_value}, {your_name}
    const EMAIL_TEMPLATES = [
        {
            id: 'followup_initial',
            name: 'Initial Follow-up',
            subject: 'Following up - {company}',
            body: `Hi {contact_first_name},

I wanted to follow up on our recent conversation about {company}.

I'd love to schedule some time to discuss how we can help you achieve your goals. Would you have 15-20 minutes this week for a quick call?

Looking forward to hearing from you.

Best regards,
{your_name}`
        },
        {
            id: 'followup_proposal',
            name: 'Proposal Follow-up',
            subject: 'Checking in on our proposal - {company}',
            body: `Hi {contact_first_name},

I wanted to check in regarding the proposal I sent over for {company}.

Have you had a chance to review it? I'd be happy to answer any questions or discuss any adjustments that might better fit your needs.

Let me know if you'd like to schedule a call this week.

Best regards,
{your_name}`
        },
        {
            id: 'followup_gentle',
            name: 'Gentle Reminder',
            subject: 'Quick check-in - {company}',
            body: `Hi {contact_first_name},

I hope this message finds you well. I wanted to gently follow up on our previous conversation.

I understand things can get busy - just wanted to make sure this didn't slip through the cracks. Is there anything I can help clarify or any questions I can answer?

No pressure at all - just let me know if and when you'd like to reconnect.

Best,
{your_name}`
        },
        {
            id: 'followup_value',
            name: 'Value Reminder',
            subject: 'Thought you might find this helpful - {company}',
            body: `Hi {contact_first_name},

I was thinking about our conversation and wanted to share a quick thought that might be valuable for {company}.

[Add your insight or value proposition here]

Would love to discuss this further if you're interested. Let me know!

Best regards,
{your_name}`
        }
    ];

    // Your name for email signatures (customize this!)
    const YOUR_NAME = 'Your Name';

    const STORAGE_KEY = 'salesPipelineData';

    // ============================================================================
    // DATA MANAGEMENT
    // ============================================================================

    function loadData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            return JSON.parse(stored);
        }
        return { deals: [], nextId: 1 };
    }

    function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getDealById(id) {
        const data = loadData();
        return data.deals.find(d => d.id === id);
    }

    // ============================================================================
    // RENDERING
    // ============================================================================

    function formatCurrency(value) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(value || 0);
    }

    function getToday() {
        return new Date().toISOString().split('T')[0];
    }

    function renderPipeline() {
        const data = loadData();
        const pipeline = document.getElementById('pipeline');
        const today = getToday();

        // Group deals by stage
        const dealsByStage = {};
        STAGES.forEach(s => dealsByStage[s.id] = []);
        data.deals.forEach(deal => {
            if (dealsByStage[deal.stage]) {
                dealsByStage[deal.stage].push(deal);
            }
        });

        // Sort each stage by value (highest first)
        Object.keys(dealsByStage).forEach(stage => {
            dealsByStage[stage].sort((a, b) => (b.value || 0) - (a.value || 0));
        });

        // Render columns (exclude won/lost from main board, show at end)
        const activeStages = STAGES.filter(s => !['won', 'lost'].includes(s.id));
        const closedStages = STAGES.filter(s => ['won', 'lost'].includes(s.id));

        let html = '';

        [...activeStages, ...closedStages].forEach(stage => {
            const deals = dealsByStage[stage.id];
            const stageValue = deals.reduce((sum, d) => sum + (d.value || 0), 0);
            const isClosedStage = ['won', 'lost'].includes(stage.id);

            html += `
                <div class="stage-column flex-shrink-0 w-72 bg-gray-200 rounded-lg flex flex-col">
                    <div class="${stage.color} text-white p-3 rounded-t-lg">
                        <div class="flex justify-between items-center">
                            <span class="font-semibold">${stage.icon} ${stage.name}</span>
                            <span class="bg-white/20 px-2 py-0.5 rounded text-sm">${deals.length}</span>
                        </div>
                        ${!isClosedStage ? `<div class="text-sm opacity-90 mt-1">${formatCurrency(stageValue)}</div>` : ''}
                    </div>
                    <div class="p-2 flex-1 overflow-y-auto space-y-2">
                        ${deals.slice(0, isClosedStage ? 5 : 100).map(deal => renderDealCard(deal, today)).join('')}
                        ${isClosedStage && deals.length > 5 ? `<div class="text-center text-gray-500 text-sm py-2">+${deals.length - 5} more</div>` : ''}
                    </div>
                </div>
            `;
        });

        pipeline.innerHTML = html;
        renderStats();
        renderAlerts();
    }

    function renderDealCard(deal, today) {
        const isOverdue = deal.followupDate && deal.followupDate < today;
        const isDueToday = deal.followupDate === today;
        const needsFollowup = isOverdue || isDueToday;

        return `
            <div class="deal-card bg-white rounded-lg p-3 shadow cursor-pointer" onclick="showEditModal(${deal.id})">
                <h3 class="font-semibold text-gray-800 truncate">${escapeHtml(deal.name)}</h3>
                <div class="text-green-600 font-bold text-lg mt-1">${formatCurrency(deal.value)}</div>
                ${deal.contact ? `<div class="text-gray-500 text-sm mt-1 truncate">${escapeHtml(deal.contact)}</div>` : ''}
                ${deal.followupDate ? `
                    <div class="mt-2 text-xs px-2 py-1 rounded inline-block ${isOverdue ? 'bg-red-100 text-red-700 overdue' : isDueToday ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}">
                        ${isOverdue ? '⚠ Overdue: ' : isDueToday ? '📅 Today: ' : '📅 '}${deal.followupDate}
                    </div>
                ` : ''}
                ${deal.notes && deal.notes.length > 0 ? `<div class="text-gray-400 text-xs mt-2">📝 ${deal.notes.length} note${deal.notes.length > 1 ? 's' : ''}</div>` : ''}
                ${needsFollowup && deal.email ? `
                    <button onclick="event.stopPropagation(); showEmailModal(${deal.id})" class="mt-2 w-full bg-purple-500 hover:bg-purple-600 text-white text-xs py-1.5 px-2 rounded font-medium">
                        ✉️ Draft Email
                    </button>
                ` : ''}
            </div>
        `;
    }

    function renderStats() {
        const data = loadData();
        const activeDeals = data.deals.filter(d => !['won', 'lost'].includes(d.stage));
        const wonDeals = data.deals.filter(d => d.stage === 'won');
        const activeValue = activeDeals.reduce((sum, d) => sum + (d.value || 0), 0);
        const wonValue = wonDeals.reduce((sum, d) => sum + (d.value || 0), 0);

        const today = getToday();
        const overdueCount = activeDeals.filter(d => d.followupDate && d.followupDate < today).length;
        const dueTodayCount = activeDeals.filter(d => d.followupDate === today).length;

        let statsHtml = `
            <span class="bg-white/10 px-3 py-1 rounded">${activeDeals.length} active deals</span>
            <span class="bg-white/10 px-3 py-1 rounded">${formatCurrency(activeValue)} pipeline</span>
            <span class="bg-green-500/30 px-3 py-1 rounded">${wonDeals.length} won (${formatCurrency(wonValue)})</span>
        `;

        if (overdueCount > 0) {
            statsHtml += `<span class="bg-red-500/30 px-3 py-1 rounded">${overdueCount} overdue</span>`;
        }
        if (dueTodayCount > 0) {
            statsHtml += `<span class="bg-amber-500/30 px-3 py-1 rounded">${dueTodayCount} due today</span>`;
        }

        document.getElementById('stats').innerHTML = statsHtml;
    }

    function renderAlerts() {
        const data = loadData();
        const today = getToday();
        const activeDeals = data.deals.filter(d => !['won', 'lost'].includes(d.stage));

        // Find deals with follow-ups due today or overdue
        const overdueDeals = activeDeals.filter(d => d.followupDate && d.followupDate < today);
        const dueTodayDeals = activeDeals.filter(d => d.followupDate === today);

        const alertBanner = document.getElementById('alertBanner');
        const alertMessage = document.getElementById('alertMessage');

        if (overdueDeals.length > 0 || dueTodayDeals.length > 0) {
            let messages = [];

            if (overdueDeals.length > 0) {
                const names = overdueDeals.map(d => `<strong>${escapeHtml(d.name)}</strong>`).join(', ');
                messages.push(`<span class="font-semibold">${overdueDeals.length} overdue follow-up${overdueDeals.length > 1 ? 's' : ''}:</span> ${names}`);
            }

            if (dueTodayDeals.length > 0) {
                const names = dueTodayDeals.map(d => `<strong>${escapeHtml(d.name)}</strong>`).join(', ');
                messages.push(`<span class="font-semibold">${dueTodayDeals.length} follow-up${dueTodayDeals.length > 1 ? 's' : ''} due today:</span> ${names}`);
            }

            alertMessage.innerHTML = messages.join('<br>');
            alertBanner.classList.remove('hidden');
        } else {
            alertBanner.classList.add('hidden');
        }
    }

    function populateStageSelect() {
        const select = document.getElementById('dealStage');
        select.innerHTML = STAGES.map(s => `<option value="${s.id}">${s.icon} ${s.name}</option>`).join('');
    }

    // ============================================================================
    // MODAL HANDLING
    // ============================================================================

    function showAddModal() {
        document.getElementById('modalTitle').textContent = 'Add New Deal';
        document.getElementById('submitBtn').textContent = 'Save Deal';
        document.getElementById('dealForm').reset();
        document.getElementById('dealId').value = '';
        document.getElementById('deleteBtn').classList.add('hidden');
        document.getElementById('existingNotes').innerHTML = '';
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('modal').classList.add('flex');
        document.getElementById('dealName').focus();
    }

    function showEditModal(id) {
        const deal = getDealById(id);
        if (!deal) return;

        document.getElementById('modalTitle').textContent = 'Edit Deal';
        document.getElementById('submitBtn').textContent = 'Update Deal';
        document.getElementById('dealId').value = deal.id;
        document.getElementById('dealName').value = deal.name;
        document.getElementById('dealValue').value = deal.value || '';
        document.getElementById('dealStage').value = deal.stage;
        document.getElementById('dealContact').value = deal.contact || '';
        document.getElementById('dealEmail').value = deal.email || '';
        document.getElementById('dealPhone').value = deal.phone || '';
        document.getElementById('dealFollowup').value = deal.followupDate || '';
        document.getElementById('dealNote').value = '';
        document.getElementById('deleteBtn').classList.remove('hidden');

        // Show existing notes
        let notesHtml = '';
        if (deal.notes && deal.notes.length > 0) {
            notesHtml = '<div class="border-t pt-3"><h4 class="font-medium text-gray-700 mb-2">Previous Notes</h4>';
            deal.notes.slice().reverse().forEach(note => {
                notesHtml += `
                    <div class="bg-gray-50 p-2 rounded mb-2 text-sm">
                        <span class="text-gray-500">${note.timestamp.split('T')[0]}</span>
                        <p class="text-gray-700">${escapeHtml(note.text)}</p>
                    </div>
                `;
            });
            notesHtml += '</div>';
        }
        document.getElementById('existingNotes').innerHTML = notesHtml;

        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('modal').classList.add('flex');
    }

    function closeModal() {
        document.getElementById('modal').classList.add('hidden');
        document.getElementById('modal').classList.remove('flex');
    }

    // ============================================================================
    // CRUD OPERATIONS
    // ============================================================================

    function saveDeal(e) {
        e.preventDefault();
        const data = loadData();
        const id = document.getElementById('dealId').value;

        const dealData = {
            name: document.getElementById('dealName').value.trim(),
            value: parseFloat(document.getElementById('dealValue').value) || 0,
            stage: document.getElementById('dealStage').value,
            contact: document.getElementById('dealContact').value.trim(),
            email: document.getElementById('dealEmail').value.trim(),
            phone: document.getElementById('dealPhone').value.trim(),
            followupDate: document.getElementById('dealFollowup').value,
            updatedAt: new Date().toISOString(),
        };

        const noteText = document.getElementById('dealNote').value.trim();

        if (id) {
            // Update existing deal
            const deal = data.deals.find(d => d.id === parseInt(id));
            if (deal) {
                Object.assign(deal, dealData);
                if (noteText) {
                    deal.notes = deal.notes || [];
                    deal.notes.push({ text: noteText, timestamp: new Date().toISOString() });
                }
            }
        } else {
            // Add new deal
            const newDeal = {
                id: data.nextId++,
                ...dealData,
                notes: noteText ? [{ text: noteText, timestamp: new Date().toISOString() }] : [],
                createdAt: new Date().toISOString(),
            };
            data.deals.push(newDeal);
        }

        saveData(data);
        closeModal();
        renderPipeline();
    }

    function deleteDeal() {
        const id = parseInt(document.getElementById('dealId').value);
        if (!id) return;

        if (confirm('Are you sure you want to delete this deal?')) {
            const data = loadData();
            data.deals = data.deals.filter(d => d.id !== id);
            saveData(data);
            closeModal();
            renderPipeline();
        }
    }

    // ============================================================================
    // UTILITIES
    // ============================================================================

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ============================================================================
    // EXPORT/IMPORT (for backup)
    // ============================================================================

    function exportData() {
        const data = loadData();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sales-pipeline-backup-${getToday()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importData(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.deals && Array.isArray(data.deals)) {
                    saveData(data);
                    renderPipeline();
                    alert('Data imported successfully!');
                } else {
                    alert('Invalid backup file format.');
                }
            } catch (err) {
                alert('Error reading file: ' + err.message);
            }
        };
        reader.readAsText(file);
    }

    // ============================================================================
    // EMAIL DRAFTING
    // ============================================================================

    let currentEmailDealId = null;

    function showEmailModal(dealId) {
        const deal = getDealById(dealId);
        if (!deal) return;

        currentEmailDealId = dealId;

        // Populate template dropdown
        const templateSelect = document.getElementById('emailTemplate');
        templateSelect.innerHTML = EMAIL_TEMPLATES.map(t =>
            `<option value="${t.id}">${t.name}</option>`
        ).join('');

        // Set the "to" field
        document.getElementById('emailTo').value = deal.email || '';

        // Apply the first template
        applyEmailTemplate();

        // Show modal
        document.getElementById('emailModal').classList.remove('hidden');
        document.getElementById('emailModal').classList.add('flex');
    }

    function closeEmailModal() {
        document.getElementById('emailModal').classList.add('hidden');
        document.getElementById('emailModal').classList.remove('flex');
        currentEmailDealId = null;
    }

    function applyEmailTemplate() {
        const deal = getDealById(currentEmailDealId);
        if (!deal) return;

        const templateId = document.getElementById('emailTemplate').value;
        const template = EMAIL_TEMPLATES.find(t => t.id === templateId);
        if (!template) return;

        // Replace variables in template
        const variables = {
            '{contact_name}': deal.contact || 'there',
            '{contact_first_name}': (deal.contact || 'there').split(' ')[0],
            '{company}': deal.name || 'your company',
            '{deal_value}': formatCurrency(deal.value),
            '{your_name}': YOUR_NAME
        };

        let subject = template.subject;
        let body = template.body;

        Object.keys(variables).forEach(key => {
            subject = subject.replace(new RegExp(key.replace(/[{}]/g, '\\$&'), 'g'), variables[key]);
            body = body.replace(new RegExp(key.replace(/[{}]/g, '\\$&'), 'g'), variables[key]);
        });

        document.getElementById('emailSubject').value = subject;
        document.getElementById('emailBody').value = body;
    }

    function openInEmailClient() {
        const to = document.getElementById('emailTo').value;
        const subject = document.getElementById('emailSubject').value;
        const body = document.getElementById('emailBody').value;

        const mailtoLink = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        window.location.href = mailtoLink;

        // Add a note to the deal that email was drafted
        if (currentEmailDealId) {
            const data = loadData();
            const deal = data.deals.find(d => d.id === currentEmailDealId);
            if (deal) {
                deal.notes = deal.notes || [];
                deal.notes.push({
                    text: `📧 Follow-up email drafted: "${subject}"`,
                    timestamp: new Date().toISOString()
                });
                saveData(data);
                renderPipeline();
            }
        }

        closeEmailModal();
    }

    function copyEmailToClipboard() {
        const subject = document.getElementById('emailSubject').value;
        const body = document.getElementById('emailBody').value;
        const fullEmail = `Subject: ${subject}\n\n${body}`;

        navigator.clipboard.writeText(fullEmail).then(() => {
            alert('Email copied to clipboard!');

            // Add a note to the deal
            if (currentEmailDealId) {
                const data = loadData();
                const deal = data.deals.find(d => d.id === currentEmailDealId);
                if (deal) {
                    deal.notes = deal.notes || [];
                    deal.notes.push({
                        text: `📧 Follow-up email drafted: "${subject}"`,
                        timestamp: new Date().toISOString()
                    });
                    saveData(data);
                    renderPipeline();
                }
            }

            closeEmailModal();
        }).catch(err => {
            alert('Failed to copy: ' + err);
        });
    }

    // ============================================================================
    // SAMPLE DATA (for testing)
    // ============================================================================

    function initSampleData() {
        const data = loadData();
        // Only add sample data if no deals exist
        if (data.deals.length === 0) {
            // Create a date 5 days in the past for testing overdue alert
            const pastDate = new Date();
            pastDate.setDate(pastDate.getDate() - 5);
            const pastDateStr = pastDate.toISOString().split('T')[0];

            const sampleDeal = {
                id: data.nextId++,
                name: 'Acme Corporation',
                value: 25000,
                stage: 'contact',
                contact: 'Jane Smith',
                email: 'jane.smith@acme.com',
                phone: '(555) 123-4567',
                followupDate: pastDateStr,
                notes: [{ text: 'Initial outreach - very interested in our services', timestamp: new Date().toISOString() }],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
            };

            data.deals.push(sampleDeal);
            saveData(data);
        }
    }

    // ============================================================================
    // INITIALIZATION
    // ============================================================================

    document.addEventListener('DOMContentLoaded', function() {
        initSampleData();
        populateStageSelect();
        renderPipeline();

        document.getElementById('dealForm').addEventListener('submit', saveDeal);

        // Close modals on outside click
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.getElementById('emailModal').addEventListener('click', function(e) {
            if (e.target === this) closeEmailModal();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeEmailModal();
            }
            if (e.key === 'n' && !e.ctrlKey && !e.metaKey &&
                !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                e.preventDefault();
                showAddModal();
            }
        });

        // Add export/import to header (hidden in a simple way)
        console.log('Tip: Use exportData() and importData(file) in console to backup/restore your data');
    });
    </script>
</body>
</html>
